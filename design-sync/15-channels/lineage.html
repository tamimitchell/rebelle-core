<!-- @dsCard group="15 · Channels" viewport="700x170" name="Lineage" subtitle="Shapes flow one way — glass and blur never backport onto the air" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:170px;background:var(--navy-night);display:flex;align-items:center;justify-content:center;gap:28px;font-family:var(--font-body)}
.panel{width:225px;height:110px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;box-sizing:border-box}
.oa{background:var(--navy);border:1px solid rgba(255,255,255,.08)}
.fg{background:linear-gradient(135deg,var(--fgi-tint-top),var(--fgi-tint-bottom));border:none;border-radius:var(--fgi-radius);backdrop-filter:blur(var(--fgi-blur));box-shadow:inset 0 1px 0 var(--fgi-light-catch),var(--fgi-shadow)}
.tag{font-family:var(--font-mono);font-size:var(--fs-doc-kicker);letter-spacing:var(--track-kicker);text-transform:uppercase}
.oa .tag{color:var(--on-air)}
.fg .tag{color:var(--cyan)}
.nm{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:var(--track-caps);color:var(--white)}
.sub{font-size:10px;color:var(--label-on-dark)}
.arrow{font-family:var(--font-mono);color:var(--cyan);font-size:22px}
</style></head><body>
<div class="panel oa"><span class="tag">● On-Air</span><span class="nm">BROADCAST</span><span class="sub">slightly transparent · never blurred · rounded, deep-inset ring</span></div>
<span class="arrow">→</span>
<div class="panel fg"><span class="tag">Live</span><span class="nm">FIELD GLASS</span><span class="sub">translucent chrome · deepens top-to-bottom, never fades out</span></div>
</body></html>
