<!-- @dsCard group="14 · Imagery" viewport="700x230" name="The warm duotone" subtitle="A named register ✅ — the sepia/warm-mono treatment for series covers and title cards, used with a light hand" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:230px;display:grid;grid-template-columns:1fr 1fr;font-family:var(--font-body);background:var(--navy-night)}
figure{margin:0;position:relative;overflow:hidden}
img{width:100%;height:100%;object-fit:cover;display:block}
.duo img{filter:sepia(.6) saturate(.8) contrast(1.05)}
figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 9px;background:linear-gradient(180deg,transparent,rgba(6,16,31,.85));font-family:var(--font-mono);font-size:var(--fs-doc-kicker);letter-spacing:.12em;text-transform:uppercase;color:var(--white-soft)}
.duo .st{position:absolute;left:14px;top:12px;color:var(--white);font-family:var(--font-serif);font-style:italic;font-size:19px;text-shadow:0 1px 8px rgba(6,16,31,.5)}
</style></head><body>
<figure><img src="../assets/photos/2021-dune-vastness_regine-trias.jpg" alt="True color"><figcaption>True color leads — the default · Regine Trias</figcaption></figure>
<figure class="duo"><img src="../assets/photos/2021-dune-vastness_regine-trias.jpg" alt="Warm duotone"><span class="st">"Everyone starts somewhere."</span><figcaption>Warm duotone — openers only · Regine Trias</figcaption></figure>
</body></html>
