<!-- @dsCard group="14 · Imagery" viewport="700x250" name="The light" subtitle="Warm western light leads; the day has an arc and the imagery keeps it" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:250px;background:var(--navy-night);color:var(--white);font-family:var(--font-body);display:flex;flex-direction:column}
.strip{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;min-height:0}
figure{margin:0;position:relative;overflow:hidden}
img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(180deg,transparent,rgba(6,16,31,.85));font-family:var(--font-mono);font-size:var(--fs-doc-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--white-soft)}
.arc{display:flex;align-items:center;padding:11px 20px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--label-on-dark)}
.arc span{flex:1;text-align:center}
.arc em{font-style:normal;color:var(--cyan)}
</style></head><body>
<div class="strip">
<figure><img src="../assets/photos/2025-day4-start_evan-davis.jpg" alt="Cold dawn start"><figcaption>Dawn · Evan Davis</figcaption></figure>
<figure><img src="../assets/photos/2025-day7-aerial-read_rebelle-rally.jpg" alt="Hard honest noon"><figcaption>Noon · Rebelle Rally</figcaption></figure>
<figure><img src="../assets/photos/2025-day8-team147_tim-sutton.jpg" alt="Golden hour"><figcaption>Golden hour · Tim Sutton</figcaption></figure>
<figure><img src="../assets/photos/2025-day7-camp-night_tim-sutton.jpg" alt="Lantern and headlamp night"><figcaption>Night · Tim Sutton</figcaption></figure>
</div>
<div class="arc"><span>cold dawn starts</span><span>→</span><span>hard honest noon</span><span>→</span><span><em>golden hour — the brand's hour</em></span><span>→</span><span>lantern &amp; headlamp night</span></div>
</body></html>
