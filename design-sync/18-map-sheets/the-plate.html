<!-- @dsCard group="18 · Map Sheets" viewport="700x300" name="The plate" subtitle="The world map's sheet, for places rather than a course: sand tinted by height, the relief pressed in, a midnight sea with a bone shore, and nothing else, so the cyan marks are the only colour on it" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:300px;display:grid;grid-template-columns:1.45fr 1fr;background:var(--navy-dusk);color:var(--desert-bone);font-family:var(--font-body)}
.s{position:relative;overflow:hidden;border-right:1px solid color-mix(in srgb,var(--desert-bone) 22%,transparent)}
.s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.k{padding:22px 24px;display:flex;flex-direction:column;gap:9px}
.nm{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:var(--ls-display);text-transform:uppercase;color:var(--white)}
.row{display:flex;gap:10px;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.sw{width:22px;height:12px;flex:none;border:1px solid color-mix(in srgb,var(--desert-bone) 30%,transparent)}
.dot{width:12px;height:12px;flex:none;margin:0 5px;border-radius:50%;background:var(--cyan);border:1px solid rgba(255,255,255,.55);box-shadow:0 0 8px 3px color-mix(in srgb,var(--cyan-lift) 34%,transparent)}
</style></head><body>
<div class="s"><img src="../assets/maps/plate.jpg" alt=""></div>
<div class="k"><span class="nm">The plate</span>
<span class="row"><span class="sw" style="background:linear-gradient(90deg,#E6D6B6,#DCC7A3,#D0B690,#C3A47E,#B6946E)"></span>Land · desert dune, tinted by height</span>
<span class="row"><span class="sw" style="background:var(--navy-dusk)"></span>Sea · navy dusk</span>
<span class="row"><span class="sw" style="background:var(--navy-dusk);box-shadow:inset 0 -2px 0 var(--desert-bone)"></span>Shore · desert bone, faint far out</span>
<span class="row"><span class="dot"></span>A place · cyan, frost rim, soft glow</span>
<span class="row" style="margin-top:6px;opacity:.7">No roads · no borders · no names</span>
</div>
</body></html>
