<!-- @dsCard group="18 · Map Sheets" viewport="700x300" name="The two sheets" subtitle="One style, two cuts. Atlas keeps a ghost of the imagery, minor contours, tracks and landform names. Terrain Paper drops all of it so titles and panels sit calm" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:300px;display:grid;grid-template-columns:1fr 1fr;font-family:var(--font-body);color:var(--ink)}
.s{position:relative;overflow:hidden}
.s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s+.s{border-left:1px solid var(--terrain-line)}
.cap{position:absolute;left:16px;bottom:14px;display:flex;flex-direction:column;gap:3px;padding:10px 14px;background:var(--paper-sand);border:1px solid var(--terrain-line)}
.nm{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:var(--ls-display);text-transform:uppercase}
.use{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--desert-taupe)}
.use b{color:var(--cyan);font-weight:400}
</style></head><body>
<div class="s"><img src="../assets/maps/atlas.jpg" alt=""><div class="cap"><span class="nm">Atlas</span><span class="use">Full detail · the website · <b>imagery ghost, minor contours, tracks, names</b></span></div></div>
<div class="s"><img src="../assets/maps/terrain-paper.jpg" alt=""><div class="cap"><span class="nm">Terrain Paper</span><span class="use">Simplified · video · <b>index contours, main roads, no labels</b></span></div></div>
</body></html>
