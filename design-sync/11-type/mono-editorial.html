<!-- @dsCard group="11 · Type & measure" viewport="700x270" name="Mono stamps & the editorial quote" subtitle="IBM Plex Mono for instrument labels only; Cormorant Garamond at most once per page, never UI" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:270px;display:grid;grid-template-columns:1fr 1.3fr;font-family:var(--font-body)}
.mono{background:var(--navy-night);color:var(--white);padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.hd{font-family:var(--font-mono);font-size:var(--fs-doc-kicker);letter-spacing:var(--ls-label-wide);text-transform:uppercase;color:var(--cyan)}
.r{display:flex;align-items:baseline;gap:12px}
.mo{font-family:var(--font-mono);text-transform:uppercase;white-space:nowrap}
.m{font-family:var(--font-mono);font-size:8px;letter-spacing:.08em;color:var(--label-on-dark);text-transform:uppercase;margin-left:auto}
.quote{padding:24px 28px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-sizing:border-box}
blockquote{margin:0;font-family:var(--font-wordmark);font-weight:500;font-size:34px;line-height:var(--lh-quote)}
cite{font-family:var(--font-mono);font-style:normal;font-size:var(--fs-mono-micro);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-soft)}
</style></head><body>
<div class="mono"><span class="hd">Mono scale — labels, never sentences</span>
<div class="r"><span class="mo" style="font-size:var(--fs-mono-stamp);letter-spacing:var(--ls-label-wide)">Day 4 · CP5 · 36.140°N 115.156°W</span><span class="m">stamp 12</span></div>
<div class="r"><span class="mo" style="font-size:var(--fs-mono-label);letter-spacing:var(--ls-label-wide);color:var(--white-soft)">Stage · Position · Last update</span><span class="m">label 10</span></div>
<div class="r"><span class="mo" style="font-size:var(--fs-mono-micro);letter-spacing:var(--ls-label);color:var(--label-on-dark)">Dispatch · Photo: Evan Davis · #rebellerally</span><span class="m">micro 9</span></div>
</div>
<div class="quote terrain tp-plain"><blockquote>"Zero background in rally, but a Ph.D. in fearless."</blockquote><cite>Quote · w500 · clamp 30→52 · max one per page</cite></div>
</body></html>
