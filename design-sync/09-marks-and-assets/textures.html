<!-- @dsCard group="09 · Marks & Assets" viewport="700x300" name="Textures — the linework" subtitle="The official texture set. Atmosphere and structure, never the signal — quiet, in each ground's own ink" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:300px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;font-family:var(--font-body);color:var(--white)}
.t{position:relative;background:var(--ground-navy);overflow:hidden;display:flex;align-items:flex-end;padding:14px 16px;box-sizing:border-box}
.t+.t{border-left:1px solid rgba(255,255,255,.06)}
.tex{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.16}
.cap{position:relative;display:flex;flex-direction:column;gap:2px}
.nm{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:var(--ls-display);text-transform:uppercase}
.use{font-family:var(--font-mono);font-size:var(--fs-doc-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--label-on-dark)}
</style></head><body>
<div class="t"><div class="tex" style="background-image:url('../assets/textures/topo-lines.svg')"></div><div class="cap"><span class="nm">Topo lines</span><span class="use">Navy Ground · Field Glass panels (masked)</span></div></div>
<div class="t"><div class="tex" style="background-image:url('../assets/textures/wave-lines.svg')"></div><div class="cap"><span class="nm">Wave lines</span><span class="use">Sponsor wall · trailer wrap register</span></div></div>
<div class="t"><div class="tex" style="background-image:url('../assets/textures/mountains.svg')"></div><div class="cap"><span class="nm">Mountains</span><span class="use">Heroes · large bands</span></div></div>
<div class="t"><div class="tex" style="background-image:url('../assets/textures/cracks.png')"></div><div class="cap"><span class="nm">Cracks</span><span class="use">Accent moments · never behind body copy</span></div></div>
</body></html>
