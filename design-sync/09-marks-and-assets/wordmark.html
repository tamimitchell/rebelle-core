<!-- @dsCard group="09 · Marks & Assets" viewport="700x300" name="Wordmark & lockups" subtitle="Engraved serif letterforms — logo artwork, never typeset" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:300px;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr;font-family:var(--font-body)}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;box-sizing:border-box;min-width:0;min-height:0;overflow:hidden}
.light{background:var(--paper-cool)}
.dark{background:var(--ground-navy)}
.k{font-family:var(--font-mono);font-size:var(--fs-doc-kicker);letter-spacing:var(--track-kicker);text-transform:uppercase}
.light .k{color:var(--ink-soft)}.dark .k{color:var(--label-on-dark)}
</style></head><body>
<div class="cell light"><img style="max-width:70%;max-height:60%;width:auto;height:auto" src="../assets/logo/wordmark-curved-navy.png" alt="Curved wordmark navy"><span class="k">Curved wordmark — navy</span></div>
<div class="cell light" style="border-left:1px solid var(--hairline)"><img style="max-height:65%;max-width:80%;width:auto;height:auto" src="../assets/logo/lockup-no-shield.png" alt="Stacked lockup, no shield"><span class="k">Stacked lockup — no shield</span></div>
<div class="cell dark" style="grid-column:1/-1"><img style="max-width:44%;max-height:55%;width:auto;height:auto" src="../assets/logo/wordmark-curved-white.png" alt="Curved wordmark white"><span class="k">Curved wordmark — white on dark · the letterforms are artwork, never typeset</span></div>
</body></html>
