<!-- @dsCard group="09 · Marks & Assets" viewport="700x260" name="The shield" subtitle="Primary mark — dimensional for hero moments, flat for everything else, white knockout on dark" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;height:260px;display:grid;grid-template-columns:1fr 1fr 1fr;font-family:var(--font-body)}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box}
.light{background:var(--paper-cool)}
.dark{background:var(--ground-navy)}
img{height:150px;width:auto}
.k{font-family:var(--font-mono);font-size:var(--fs-doc-kicker);letter-spacing:var(--track-kicker);text-transform:uppercase}
.light .k{color:var(--ink-soft)}.dark .k{color:var(--label-on-dark)}
</style></head><body>
<div class="cell light"><img src="../assets/logo/shield-dimensional.png" alt="Dimensional shield"><span class="k">Dimensional — hero</span></div>
<div class="cell light"><img src="../assets/logo/shield-flat.png" alt="Flat shield"><span class="k">Flat — default</span></div>
<div class="cell dark"><img src="../assets/logo/shield-white.png" alt="White shield"><span class="k">White + cyan — on dark</span></div>
</body></html>
